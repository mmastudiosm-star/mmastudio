<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویدیوها - لایتنینگ استودیو</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0f0f1a;
        color: #e0e0e0;
        line-height: 1.7;
        padding: 20px;
        direction: rtl;
    }
    .container {
        max-width: 1100px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(5px);
        padding: 40px 50px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.08);
    }
    h1 {
        font-size: 3rem;
        background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        margin-bottom: 5px;
        letter-spacing: 2px;
    }
    .subtitle {
        text-align: center;
        color: #aaa;
        font-size: 1.2rem;
        border-bottom: 2px solid #333;
        padding-bottom: 20px;
        margin-bottom: 30px;
    }
    .nav-menu {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 30px;
        padding: 15px;
        background: rgba(255,255,255,0.05);
        border-radius: 16px;
        border: 1px solid #2a2a3a;
    }
    .nav-btn {
        padding: 10px 25px;
        background: rgba(255,255,255,0.08);
        color: #e0e0e0;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        border: 1px solid transparent;
    }
    .nav-btn:hover {
        background: linear-gradient(135deg, #f5576c, #4facfe);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(79, 172, 254, 0.3);
        border-color: #4facfe;
    }
    .nav-btn.video-btn {
        background: linear-gradient(135deg, #f093fb, #f5576c);
        color: #fff;
        box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
    }
    .nav-btn.video-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(245, 87, 108, 0.5);
        background: linear-gradient(135deg, #f5576c, #f093fb);
    }
    .section {
        margin-bottom: 40px;
    }
    .section h2 {
        font-size: 2rem;
        color: #fff;
        border-right: 5px solid #4facfe;
        padding-right: 15px;
        margin-bottom: 20px;
    }
    .video-card {
        background: rgba(255,255,255,0.04);
        padding: 20px;
        border-radius: 16px;
        border-right: 4px solid #4facfe;
        margin-bottom: 15px;
        transition: transform 0.3s ease, border-color 0.3s;
    }
    .video-card:hover {
        transform: translateX(-5px);
        border-color: #f093fb;
    }
    .video-card h3 {
        color: #fff;
        font-size: 1.2rem;
    }
    .video-card p {
        color: #ccc;
        margin: 8px 0;
    }
    .watch-btn {
        display: inline-block;
        margin-top: 10px;
        padding: 8px 25px;
        background: linear-gradient(135deg, #4facfe, #43e97b);
        color: #fff;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.85rem;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }
    .watch-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
        background: linear-gradient(135deg, #43e97b, #4facfe);
    }
    .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 30px;
        background: linear-gradient(135deg, #f5576c, #f093fb);
        color: #fff;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
    }
    .back-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
    }
    .footer {
        text-align: center;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #2a2a3a;
        color: #666;
        font-size: 0.9rem;
    }
    @media (max-width: 700px) {
        .container { padding: 20px; }
        h1 { font-size: 2rem; }
        .nav-menu { gap: 10px; }
        .nav-btn { padding: 8px 18px; font-size: 0.85rem; }
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 لایتنینگ استودیو</h1>
        <div class="subtitle">ویدیوهای آموزشی گروه</div>

        <div class="nav-menu">
            <a href="index.html" class="nav-btn">🏠 صفحه اصلی</a>
            <a href="#" class="nav-btn video-btn">🎥 ویدیوها</a>
        </div>

        <div class="section">
            <h2>📹 ویدیوهای آموزشی</h2>
            
        <div class="video-card">
            <h3>🎬 آموزش اسکرچ جونیور پارت ۱: بازی خروس و طوفان</h3>
            <p>آموزش برنامه‌نویسی کودکان با اسکرچ جونیور - ساخت بازی جذاب</p>
            <a href="https://www.aparat.com/v/bewg9bw" target="_blank" class="watch-btn">▶️ تماشا در آپارات</a>
        </div>
        
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-btn">🔙 بازگشت به صفحه اصلی</a>
        </div>

        <div class="footer">
            © 2026 تمامی حقوق برای گروه لایتنینگ استودیو محفوظ است.
        </div>
    </div>
</body>
</html>
